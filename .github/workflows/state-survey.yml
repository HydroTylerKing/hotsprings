name: State survey springs
on:
  workflow_dispatch:
  push:
    paths: ['tools/state_survey.py', '.github/workflows/state-survey.yml']
  schedule:
    - cron: '17 9 1 */3 *'   # quarterly refresh
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/state_survey.py
      - run: python tools/merge_state_survey.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/ss_raw.json data/springs.json
          git diff --cached --quiet || git commit -m "Update state-survey springs"
          git push
