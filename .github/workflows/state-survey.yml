name: State survey springs
on:
  workflow_dispatch:
  push:
    paths: ['tools/state_survey.py', '.github/workflows/state-survey.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/state_survey.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/ss_raw.json
          git diff --cached --quiet || git commit -m "Update state-survey springs (data/ss_raw.json)"
          git push
